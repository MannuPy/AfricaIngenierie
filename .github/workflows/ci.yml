name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build production applications
        run: pnpm build

      - name: Validate Oracle production Compose
        run: docker compose --env-file .env.oracle.example -f docker-compose.prod.yml config --quiet

      - name: Prepare local environment
        shell: bash
        run: cp .env.example .env.local

      - name: Start local dependencies and applications
        run: pnpm up

      - name: Run CMS, RBAC and OpenAPI tests
        run: pnpm test

      - name: Check public routes
        run: pnpm routes:check

      - name: Stop local stack
        if: always()
        run: pnpm down
