name: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}

# Production OVH VPS.
# Ce fichier est autonome : il ne charge ni l’override local, ni les bind
# mounts du mode développement. Les secrets viennent de .env.ovh.test, absent
# du dépôt, ou d’un gestionnaire de secrets injecté par l’hôte.

services:
  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-postgres:${RELEASE_VERSION:?RELEASE_VERSION is required}
    env_file: ["${PRODUCTION_ENV_FILE:-.env.ovh.test}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${TZ:-UTC}
    # Filet de sécurité contre les transactions abandonnées et les requêtes
    # sans fin. Les timeouts applicatifs restent la première défense.
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - statement_timeout=120000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend_net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -q']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  seaweedfs:
    build:
      context: .
      dockerfile: infra/docker/seaweedfs.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-seaweedfs:${RELEASE_VERSION:?RELEASE_VERSION is required}
    env_file: ["${PRODUCTION_ENV_FILE:-.env.ovh.test}"]
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:?S3_BACKUP_ACCESS_KEY is required}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?S3_BACKUP_SECRET_KEY is required}
    volumes:
      - seaweedfs_data:/data
    networks: [backend_net]
    healthcheck:
      test: ['CMD', 'weed', 'version']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  cms-migrate:
    build:
      context: .
      dockerfile: infra/docker/cms.Dockerfile
      target: migrator
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-cms-migrator:${RELEASE_VERSION:?RELEASE_VERSION is required}
    env_file: ["${PRODUCTION_ENV_FILE:-.env.ovh.test}"]
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      CONTACT_INTERNAL_SECRET: ${CONTACT_INTERNAL_SECRET:?CONTACT_INTERNAL_SECRET is required}
      CMS_INTERNAL_READ_SECRET: ${CMS_INTERNAL_READ_SECRET:?CMS_INTERNAL_READ_SECRET is required}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?AUDIT_HASH_SECRET is required}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend_net]
    restart: 'no'

  retention-cleanup:
    build:
      context: .
      dockerfile: infra/docker/cms.Dockerfile
      target: maintenance
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-cms-maintenance:${RELEASE_VERSION:?RELEASE_VERSION is required}
    profiles: [ops]
    env_file: ["${PRODUCTION_ENV_FILE:-.env.ovh.test}"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?AUDIT_HASH_SECRET is required}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend_net]
    restart: 'no'

  cms:
    build:
      context: .
      dockerfile: infra/docker/cms.Dockerfile
      target: runner
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-cms:${RELEASE_VERSION:?RELEASE_VERSION is required}
    env_file: ["${PRODUCTION_ENV_FILE:-.env.ovh.test}"]
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET is required}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?REVALIDATION_SECRET is required}
      CONTACT_INTERNAL_SECRET: ${CONTACT_INTERNAL_SECRET:?CONTACT_INTERNAL_SECRET is required}
      CMS_INTERNAL_READ_SECRET: ${CMS_INTERNAL_READ_SECRET:?CMS_INTERNAL_READ_SECRET is required}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:?AUDIT_HASH_SECRET is required}
    depends_on:
      cms-migrate: { condition: service_completed_successfully }
      seaweedfs: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [frontend_net, backend_net]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-web:${RELEASE_VERSION:?RELEASE_VERSION is required}
    env_file: ["${PRODUCTION_ENV_FILE:-.env.ovh.test}"]
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      CMS_INTERNAL_URL: ${CMS_INTERNAL_URL:?CMS_INTERNAL_URL is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:?PAYLOAD_PUBLIC_SERVER_URL is required}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET is required}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?REVALIDATION_SECRET is required}
      CONTACT_INTERNAL_SECRET: ${CONTACT_INTERNAL_SECRET:?CONTACT_INTERNAL_SECRET is required}
      CMS_INTERNAL_READ_SECRET: ${CMS_INTERNAL_READ_SECRET:?CMS_INTERNAL_READ_SECRET is required}
    depends_on:
      cms: { condition: service_healthy }
    networks: [frontend_net]
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/docker/nginx.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-nginx:${RELEASE_VERSION:?RELEASE_VERSION is required}
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      TLS_BOOTSTRAP: ${TLS_BOOTSTRAP:-false}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web: { condition: service_healthy }
      cms: { condition: service_healthy }
    networks: [frontend_net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --no-check-certificate -O /dev/null https://127.0.0.1/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: [ops]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  backup:
    build:
      context: .
      dockerfile: infra/docker/backup.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-africa-ingenierie}-backup:${RELEASE_VERSION:?RELEASE_VERSION is required}
    profiles: [ops]
    env_file: ["${PRODUCTION_ENV_FILE:-.env.ovh.test}"]
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:?S3_BACKUP_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?S3_BACKUP_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      BACKUP_DIR: /backup
    volumes:
      - oracle_backups:/backup
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    networks: [backend_net]
    command: ['/usr/local/bin/backup-oracle.sh']

networks:
  frontend_net:
  backend_net:
    internal: true

volumes:
  postgres_data:
  seaweedfs_data:
  letsencrypt:
  certbot_www:
  nginx_logs:
  oracle_backups:
