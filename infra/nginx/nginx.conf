# ══════════════════════════════════════════════════════════════════
#  Nginx  -  point d'entrée unique du développement local.
#  Seul ce service est publié sur l'hôte. PostgreSQL et SeaweedFS ne sont
#  joignables que depuis le réseau backend interne.
# ══════════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker attribue une nouvelle IP lorsqu'un conteneur est recréé.
    # La résolution périodique évite que Nginx conserve une ancienne IP et
    # renvoie des 502 après `docker compose up -d`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format  main  '$remote_addr - $remote_user [$time_iso8601] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" host=$host request_id=$request_id '
                      'request_time=$request_time upstream=$upstream_addr upstream_status=$upstream_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Les téléversements de médias sont plafonnés à 20 Mo
    # (docs/regles-de-gestion.md §7). Nginx refuse au-delà, avant le CMS.
    client_max_body_size 20m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml application/manifest+json;

    # Limitation de débit  -  dimensionnée au prompt 08 (contact) et 04 (connexion).
    limit_req_zone $binary_remote_addr zone=contact_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=admin_zone:10m   rate=60r/m;
    # Connexion et mot de passe oublié : 10 tentatives par minute et par IP.
    # Complété côté applicatif par le verrouillage progressif du compte.
    limit_req_zone $binary_remote_addr zone=login_zone:10m   rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
