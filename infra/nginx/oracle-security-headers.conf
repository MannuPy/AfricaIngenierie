add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Profil production : pas de eval ni de scripts inline. Les styles inline
# Payload/Next restent autorisés jusqu’à migration vers nonce/hash dédié.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https://www.openstreetmap.org https://www.youtube-nocookie.com https://www.youtube.com; form-action 'self'; img-src 'self' https://admin.ingenierieafrica.com data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://admin.ingenierieafrica.com; media-src 'self' blob:; worker-src 'self' blob:; upgrade-insecure-requests" always;
