# En-têtes de sécurité  -  socle local.
# HSTS et la CSP stricte sont ajoutés au prompt 08 / 10, une fois les
# origines réelles connues (SeaweedFS S3, polices auto-hébergées, carte).
add_header X-Content-Type-Options    "nosniff"              always;
add_header X-Frame-Options           "SAMEORIGIN"           always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"         always;
# CSP compatible avec Next.js en développement (Webpack/HMR) et les médias
# servis par Payload. Le mode production pourra retirer unsafe-eval après
# validation du build standalone.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https://www.openstreetmap.org https://www.youtube-nocookie.com https://www.youtube.com; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:;" always;
