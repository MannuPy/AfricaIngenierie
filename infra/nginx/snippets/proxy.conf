# En-têtes de proxy communs à tous les upstreams applicatifs.
proxy_http_version 1.1;
 # Conserver le port public dans Host et X-Forwarded-Host. Next.js vérifie
 # l’origine des Server Actions (notamment l’upload Payload) ; transmettre
 # seulement $host transformait admin.localhost:8080 en admin.localhost et
 # provoquait « Invalid Server Actions request » derrière Nginx.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
 # Nginx est la frontière de confiance : écraser toute valeur fournie par le
 # client pour empêcher l’usurpation de l’IP utilisée par les rate limits et
 # les journaux d’audit.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Request-ID      $request_id;
add_header X-Request-ID             $request_id always;

# Les locations qui incluent ce fichier déclarent déjà un add_header
# (X-Request-ID), ce qui annule l'héritage des add_header définis au niveau du
# serveur. Réinclure le socle ici garantit les protections sur chaque proxy.
include /etc/nginx/snippets/security-headers.conf;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# La première compilation Next/Payload peut dépasser 60 s sur Docker Desktop
# Windows ; garder un délai borné plus large pour éviter un 504 transitoire.
proxy_read_timeout 180s;
proxy_send_timeout 60s;
proxy_buffering off;
