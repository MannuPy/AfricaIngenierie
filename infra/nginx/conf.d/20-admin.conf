# ──────────────────────────────────────────────────────────────────
#  Hôte d'ADMINISTRATION  -  http://admin.localhost:8080
#  Sert apps/cms : dashboard Payload (/admin), API REST (/api) et
#  GraphQL. Reproduit en local le sous-domaine d'administration exigé
#  en production (docs/urls-et-redirections.md §3).
#
#  *.localhost est résolu vers 127.0.0.1 par les navigateurs modernes.
#  Si votre outil ne le fait pas, ajoutez dans le fichier hosts :
#     127.0.0.1  admin.localhost
# ──────────────────────────────────────────────────────────────────
server {
    listen      8080;
    listen      [::]:8080;
    server_name admin.localhost;

    include /etc/nginx/snippets/security-headers.conf;

    # Le dashboard ne doit jamais être indexé.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Limitation de débit sur l'authentification.
    #
    # Première barrière contre le bourrage d'identifiants : Nginx écarte les
    # rafales avant même qu'elles n'atteignent Payload. La seconde barrière est
    # le verrouillage progressif du compte (5 tentatives, 15 minutes), qui
    # protège un compte précis quelle que soit l'adresse d'origine.
    location /api/users/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }

    # Réinitialisation de mot de passe : même exposition, même traitement.
    location /api/users/forgot-password {
        limit_req zone=login_zone burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }

    # Fichiers de la médiathèque : contenu public, non authentifié.
    #
    # Ils passaient par « location /api/ » et sa limite de 60 requêtes par
    # minute. Or le site public charge tous ses visuels depuis cet hôte : une
    # page d'accueil qui demande une vingtaine d'images épuise la rafale de 20
    # en une seconde, puis Nginx refuse le reste. Les visuels disparaissaient
    # donc au hasard, sans erreur visible ailleurs que dans le code de réponse.
    #
    # Servir un fichier binaire déjà publié n'est ni une écriture, ni une
    # lecture authentifiée : cette route n'a pas à être limitée. Mise en cache
    # longue, car Payload renomme un fichier au lieu d'en écraser un.
    location /api/media-assets/file/ {
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;

        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        access_log off;
    }

    # Reste de l'API d'administration.
    location /api/ {
        limit_req zone=admin_zone burst=20 nodelay;
        # 429 plutôt que le 503 par défaut : le client est bridé, le service
        # n'est pas indisponible. Cohérent avec les deux routes ci-dessus.
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }
}
