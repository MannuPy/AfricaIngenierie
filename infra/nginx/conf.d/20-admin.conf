# ──────────────────────────────────────────────────────────────────
#  Hôte d'ADMINISTRATION  -  http://admin.localhost:8080
#  Sert apps/cms : dashboard Payload (/admin), API REST (/api) et
#  GraphQL. Reproduit en local le sous-domaine d'administration exigé
#  en production (docs/urls-et-redirections.md §3).
#
#  *.localhost est résolu vers 127.0.0.1 par les navigateurs modernes.
#  Si votre outil ne le fait pas, ajoutez dans le fichier hosts :
#     127.0.0.1  admin.localhost
# ──────────────────────────────────────────────────────────────────
server {
    listen      8080;
    server_name admin.localhost;

    include /etc/nginx/snippets/security-headers.conf;

    # Le dashboard ne doit jamais être indexé.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Limitation de débit sur l'authentification.
    #
    # Première barrière contre le bourrage d'identifiants : Nginx écarte les
    # rafales avant même qu'elles n'atteignent Payload. La seconde barrière est
    # le verrouillage progressif du compte (5 tentatives, 15 minutes), qui
    # protège un compte précis quelle que soit l'adresse d'origine.
    location /api/users/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }

    # Réinitialisation de mot de passe : même exposition, même traitement.
    location /api/users/forgot-password {
        limit_req zone=login_zone burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }

    # Reste de l'API d'administration.
    location /api/ {
        limit_req zone=admin_zone burst=20 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        set $cms_backend cms:3001;
        proxy_pass http://$cms_backend;
    }
}
