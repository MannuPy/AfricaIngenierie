# ──────────────────────────────────────────────────────────────────
#  Hôte du SITE PUBLIC  -  http://localhost:8080
#  Sert apps/web, y compris la future API publique /api/events
#  (prompt 09), qui reste ainsi libre de toute collision avec l'API
#  REST de Payload.
# ──────────────────────────────────────────────────────────────────
server {
    listen      8080;
    server_name localhost 127.0.0.1 "";

    include /etc/nginx/snippets/security-headers.conf;

    # Santé du proxy lui-même, sans traverser les applications.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # Le dashboard n'est pas servi sur l'hôte public : on redirige vers
    # l'hôte d'administration, comme en production (sous-domaine dédié).
    location /admin {
        return 301 http://admin.localhost:8080$request_uri;
    }

    # Le formulaire public est protégé à la frontière avant l'application.
    location = /api/contact {
        limit_req zone=contact_zone burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        include /etc/nginx/snippets/proxy.conf;
        set $web_backend web:3000;
        proxy_pass http://$web_backend;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        set $web_backend web:3000;
        proxy_pass http://$web_backend;
    }
}
