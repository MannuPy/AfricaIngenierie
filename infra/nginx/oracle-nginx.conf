user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 valid=10s ipv6=off;
  log_format main '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" host=$host upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 20m;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml application/manifest+json;
  limit_req_zone $binary_remote_addr zone=contact_zone:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  include /etc/nginx/conf.d/*.conf;
}
