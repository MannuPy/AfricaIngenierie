<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Maquette de refonte - Africa Ingenierie">
<title>Maquette Africa Ingénierie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════
   AFRICA INGÉNIERIE  -  Système de design
   Tokens : couleur, type, espace. Thème clair + sombre.
   ═══════════════════════════════════════════════════════════ */

:root{
  /* Marque */
  --brand:#003087; --brand-deep:#001F57; --brand-600:#1E5BC6;
  --brand-100:#E7EEF9; --brand-50:#F4F7FC;
  /* Accent action (rare, discipliné) */
  --accent:#E01E37; --accent-700:#B71528; --accent-50:#FDECEE;
  /* Neutres à biais bleu */
  --ink:#0F1720; --ink-700:#33404D; --ink-500:#5F6B7A; --ink-400:#8A96A5;
  --line:#D9E0E9; --line-soft:#EAEFF5;
  /* Surfaces */
  --ground:#FFFFFF; --surface:#F4F7FC; --surface-2:#EDF2F9; --card:#FFFFFF;
  /* Sémantique interface */
  --ok:#1E8E5A; --warn:#B36A00; --err:#C0243A; --info:#1E5BC6;
  --ok-bg:#E8F5EF; --warn-bg:#FDF3E3; --err-bg:#FDECEE; --info-bg:#E7EEF9;
  /* Sur panneau bleu */
  --on-brand:#FFFFFF; --on-brand-soft:#B9C9E4; --on-brand-line:rgba(255,255,255,.16);
  /* Élévation */
  --sh-1:0 1px 2px rgba(0,31,87,.06);
  --sh-2:0 4px 18px rgba(0,31,87,.08);
  --sh-3:0 14px 40px rgba(0,31,87,.13);
  /* Rayons */
  --r-btn:8px; --r-card:14px; --r-field:8px; --r-pill:999px;
  /* Type */
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-ui:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  /* Rythme */
  --wrap:1200px; --gut:24px; --sec:96px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#2E63C8; --brand-deep:#071733; --brand-600:#5A8BE0;
    --brand-100:#16294A; --brand-50:#101E36;
    --accent:#FF4257; --accent-700:#FF6274; --accent-50:#2A1219;
    --ink:#EAF0F8; --ink-700:#C3CFDE; --ink-500:#93A2B6; --ink-400:#75849A;
    --line:#26364F; --line-soft:#1B2942;
    --ground:#0A1424; --surface:#0E1B2F; --surface-2:#13243D; --card:#12203A;
    --ok:#4BD0A0; --warn:#F0B44B; --err:#FF6274; --info:#5A8BE0;
    --ok-bg:#0F2A22; --warn-bg:#2B2210; --err-bg:#2A1219; --info-bg:#10233E;
    --on-brand:#EAF0F8; --on-brand-soft:#93A6C4; --on-brand-line:rgba(255,255,255,.12);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 4px 18px rgba(0,0,0,.45);
    --sh-3:0 14px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --brand:#2E63C8; --brand-deep:#071733; --brand-600:#5A8BE0;
  --brand-100:#16294A; --brand-50:#101E36;
  --accent:#FF4257; --accent-700:#FF6274; --accent-50:#2A1219;
  --ink:#EAF0F8; --ink-700:#C3CFDE; --ink-500:#93A2B6; --ink-400:#75849A;
  --line:#26364F; --line-soft:#1B2942;
  --ground:#0A1424; --surface:#0E1B2F; --surface-2:#13243D; --card:#12203A;
  --ok:#4BD0A0; --warn:#F0B44B; --err:#FF6274; --info:#5A8BE0;
  --ok-bg:#0F2A22; --warn-bg:#2B2210; --err-bg:#2A1219; --info-bg:#10233E;
  --on-brand:#EAF0F8; --on-brand-soft:#93A6C4; --on-brand-line:rgba(255,255,255,.12);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 4px 18px rgba(0,0,0,.45);
  --sh-3:0 14px 40px rgba(0,0,0,.55);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; line-height:1.6;
  font-weight:400; -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:var(--brand-600);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
:focus-visible{outline:3px solid var(--brand-600);outline-offset:2px;border-radius:4px}

/* Motif blueprint  -  seul motif décoratif du site */
.bp{position:relative;isolation:isolate}
.bp::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(var(--on-brand-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--on-brand-line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 40%,#000 30%,transparent 78%);
}

/* ── Mise en page ─────────────────────────────────────────── */
.wrap{width:min(100% - 40px,var(--wrap));margin-inline:auto}
.sec{padding-block:var(--sec)}
.sec-sm{padding-block:64px}
.sec.tint{background:var(--surface)}
.sec.brand{background:var(--brand);color:var(--on-brand)}
.sec.brand-deep{background:var(--brand-deep);color:var(--on-brand)}
.stack{display:flex;flex-direction:column}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}.g32{gap:32px}.g48{gap:48px}
.grid{display:grid;gap:var(--gut)}
/* Empêche le « grid blowout » : sans min-width:0, une colonne fr ne peut pas
   descendre sous la largeur min-content de son contenu et déborde le conteneur. */
.grid>*,.split>*,.stack>*,.row>*{min-width:0}
/* Un .stack placé dans une .row occupe l'espace restant plutôt que de passer à la ligne */
.row>.stack{flex:1 1 0}
.row.nowrap{flex-wrap:nowrap}
.eyebrow{flex-wrap:wrap}
.c2{grid-template-columns:repeat(2,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.measure{max-width:62ch}

/* ── Typographie ──────────────────────────────────────────── */
.eyebrow{
  font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px;display:flex;align-items:center;gap:10px;
}
.eyebrow.on-brand{color:#FF8B98}
.d1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5.4vw,64px);line-height:1.04;letter-spacing:-.015em}
.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,4.2vw,48px);line-height:1.08;letter-spacing:-.012em}
.h2{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.2vw,36px);line-height:1.14;letter-spacing:-.01em}
.h3{font-family:var(--f-ui);font-weight:700;font-size:20px;line-height:1.28;letter-spacing:-.005em}
.h4{font-family:var(--f-ui);font-weight:700;font-size:16px;line-height:1.35}
.lead{font-size:clamp(17px,1.35vw,19px);line-height:1.62;color:var(--ink-700)}
.body{font-size:16px;line-height:1.65;color:var(--ink-700)}
.small{font-size:14px;line-height:1.55;color:var(--ink-500)}
.tiny{font-size:12.5px;line-height:1.45;color:var(--ink-500)}
.on-brand .lead,.on-brand .body{color:var(--on-brand-soft)}
.num{font-variant-numeric:tabular-nums}
.serif-it{font-family:var(--f-display);font-style:italic;font-weight:500}

/* ── Boutons ──────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:48px;padding:0 22px;border-radius:var(--r-btn);border:1.5px solid transparent;
  font-size:15px;font-weight:700;letter-spacing:.005em;text-decoration:none;cursor:pointer;
  transition:transform .16s ease,background .16s ease,box-shadow .16s ease,border-color .16s ease;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
/* Primaire rouge  -  un seul visible par écran */
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(224,30,55,.28)}
.btn-primary:hover{background:var(--accent-700);box-shadow:0 6px 18px rgba(224,30,55,.34)}
.btn-brand{background:var(--brand);color:#fff}
.btn-brand:hover{background:var(--brand-deep)}
.btn-outline{background:transparent;color:var(--brand);border-color:var(--line)}
.btn-outline:hover{border-color:var(--brand);background:var(--brand-50)}
.btn-ghost-light{background:transparent;color:var(--on-brand);border-color:rgba(255,255,255,.4)}
.btn-ghost-light:hover{background:rgba(255,255,255,.1);border-color:#fff}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.tlink{
  display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
  color:var(--brand-600);text-decoration:none;background:none;border:0;padding:6px 0;cursor:pointer;
}
.tlink svg{transition:transform .18s ease}
.tlink:hover svg{transform:translateX(4px)}
.tlink:hover{text-decoration:underline}
.tlink.on-brand{color:#fff}

/* ── Pastilles & étiquettes ───────────────────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);
  padding:5px 12px;font-size:12.5px;font-weight:700;letter-spacing:.02em;
  background:var(--brand-100);color:var(--brand);border:1px solid transparent;
}
.pill.red{background:var(--accent-50);color:var(--accent-700)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.neutral{background:var(--surface-2);color:var(--ink-500)}
.pill.outline{background:transparent;border-color:var(--line);color:var(--ink-500)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ── Cartes ───────────────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;position:relative;transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
}
a.card:hover,.card.hoverable:hover{box-shadow:var(--sh-3);transform:translateY(-3px);border-color:var(--line-soft)}
/* Règle rouge révélée au survol  -  l'accent n'apparaît qu'à l'interaction */
.card.ruled::after{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform .24s ease;
}
a.card.ruled:hover::after,.card.ruled.hoverable:hover::after{transform:scaleX(1)}
.card-pad{padding:26px}
.card-pad-sm{padding:20px}

/* ── Plaque blueprint (emplacement photo) ─────────────────── */
.plate{
  position:relative;background:linear-gradient(140deg,var(--brand) 0%,var(--brand-deep) 100%);
  overflow:hidden;display:grid;place-items:center;color:#fff;isolation:isolate;
}
.plate::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;
}
.plate::after{
  content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.22);
  border-radius:4px;
}
.plate-lbl{
  position:relative;z-index:1;text-align:center;padding:22px;max-width:80%;
  font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(255,255,255,.82);line-height:1.5;
}
.plate-lbl svg{margin:0 auto 10px;display:block;opacity:.7}
.ratio-43{aspect-ratio:4/3}.ratio-169{aspect-ratio:16/9}
.ratio-11{aspect-ratio:1}.ratio-32{aspect-ratio:3/2}

/* ── En-tête ──────────────────────────────────────────────── */
.skip{
  position:absolute;left:16px;top:-60px;z-index:200;background:var(--accent);color:#fff;
  padding:12px 18px;border-radius:var(--r-btn);font-weight:700;font-size:14px;
  text-decoration:none;transition:top .18s ease;
}
.skip:focus{top:16px}
.site-hd{
  position:sticky;top:0;z-index:100;background:var(--ground);
  border-bottom:1px solid var(--line-soft);
}
.hd-in{display:flex;align-items:center;gap:20px;height:78px}
.brandmark{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;flex:none}
.brandmark .mk{
  width:40px;height:40px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--brand),var(--brand-deep));
  display:grid;place-items:center;color:#fff;
}
.brandmark .nm{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
.brandmark .tg{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400)}
.mainnav{display:flex;align-items:center;gap:2px;margin-left:auto;flex-wrap:nowrap}
.mainnav a{
  position:relative;padding:9px 11px;border-radius:6px;font-size:14.5px;font-weight:600;
  color:var(--ink-700);text-decoration:none;white-space:nowrap;transition:color .15s ease,background .15s ease;
}
.mainnav a:hover{color:var(--brand);background:var(--brand-50)}
.mainnav a[aria-current="page"]{color:var(--brand);font-weight:700}
.mainnav a[aria-current="page"]::after{
  content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2.5px;
  background:var(--accent);border-radius:2px;
}
.hd-tools{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{
  width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-700);transition:all .15s ease;
}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-50)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{
  padding:0 11px;height:40px;border:0;background:transparent;font-size:13px;font-weight:700;
  color:var(--ink-500);cursor:pointer;transition:all .15s ease;
}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
.burger{display:none}
#mobnav{display:none}

/* ── Fil d'Ariane ─────────────────────────────────────────── */
.crumb{display:flex;align-items:center;gap:9px;font-size:13px;flex-wrap:wrap;color:var(--on-brand-soft)}
.crumb a{color:var(--on-brand-soft);text-decoration:none}
.crumb a:hover{color:#fff;text-decoration:underline}
.crumb span[aria-current]{color:#fff;font-weight:600}

/* ── Hero de page interne ─────────────────────────────────── */
.pagehero{background:linear-gradient(140deg,var(--brand) 0%,var(--brand-deep) 100%);color:var(--on-brand);padding-block:56px 64px}
.pagehero .h1{color:#fff}

/* ── Formulaires ──────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:14px;font-weight:700;color:var(--ink)}
.field .req{color:var(--accent);margin-left:2px}
.field .hint{font-size:12.5px;color:var(--ink-500)}
.input,.select,.textarea{
  width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:var(--r-field);background:var(--card);color:var(--ink);font-size:15px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.input::placeholder,.textarea::placeholder{color:var(--ink-400)}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(30,91,198,.15);
}
.textarea{min-height:132px;resize:vertical;line-height:1.6}
.field.invalid .input,.field.invalid .textarea,.field.invalid .select{border-color:var(--err)}
.err-msg{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--err)}
.check{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--ink-700);line-height:1.5}
.check input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--brand);flex:none;cursor:pointer}
.counter{font-size:12px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.counter.over{color:var(--err);font-weight:700}

/* ── Notice / états ───────────────────────────────────────── */
.notice{display:flex;gap:13px;padding:16px 18px;border-radius:12px;border:1px solid;align-items:flex-start}
.notice.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 32%,transparent);color:var(--ok)}
.notice.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--info)}
.notice.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 32%,transparent);color:var(--warn)}
.notice.err{background:var(--err-bg);border-color:color-mix(in srgb,var(--err) 32%,transparent);color:var(--err)}
.notice p{color:var(--ink-700)}
.notice strong{color:var(--ink)}
.notice svg{flex:none;margin-top:2px}

/* État vide  -  démonstration du principe P1 */
.empty{
  border:1.5px dashed var(--line);border-radius:var(--r-card);padding:44px 28px;text-align:center;
  background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:14px;
}
.empty .ic{
  width:56px;height:56px;border-radius:14px;background:var(--brand-100);color:var(--brand);
  display:grid;place-items:center;
}
/* Squelette de chargement  -  jamais « Loading… » */
@keyframes shim{0%{background-position:-420px 0}100%{background-position:420px 0}}
.skel{
  border-radius:7px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--line-soft) 50%,var(--surface-2) 75%);
  background-size:840px 100%;animation:shim 1.35s linear infinite;
}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* ── Statistiques ─────────────────────────────────────────── */
.stat{display:flex;flex-direction:column;gap:5px}
.stat .v{
  font-family:var(--f-display);font-weight:700;font-size:clamp(40px,4.4vw,56px);line-height:1;
  font-variant-numeric:tabular-nums;color:#fff;display:flex;align-items:flex-start;gap:2px;
}
.stat .v sup{font-size:.44em;color:#FF8B98;font-family:var(--f-ui);font-weight:800;margin-top:.35em}
.stat .k{font-size:13.5px;font-weight:600;color:var(--on-brand-soft);letter-spacing:.02em}
.stat.dark .v{color:var(--ink)}
.stat.dark .v sup{color:var(--accent)}
.stat.dark .k{color:var(--ink-500)}

/* ── Tableaux ─────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
thead th{
  text-align:left;padding:13px 16px;font-size:12px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-500);background:var(--surface);
  border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface)}

/* ── Accordéon ────────────────────────────────────────────── */
.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.acc+.acc{margin-top:12px}
.acc summary{
  padding:18px 20px;cursor:pointer;font-weight:700;font-size:15.5px;display:flex;
  align-items:center;justify-content:space-between;gap:16px;list-style:none;
}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{
  content:"";width:11px;height:11px;flex:none;border-right:2.2px solid var(--brand);
  border-bottom:2.2px solid var(--brand);transform:rotate(45deg) translateY(-3px);transition:transform .2s ease;
}
.acc[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.acc summary:hover{background:var(--brand-50)}
.acc .acc-body{padding:0 20px 20px;color:var(--ink-700);font-size:15px;line-height:1.65}

/* ── Avant / après ────────────────────────────────────────── */
.ba{position:relative;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line)}
.ba-imgs{position:relative;aspect-ratio:16/9}
.ba-imgs>*{position:absolute;inset:0}
.ba-after{clip-path:inset(0 0 0 var(--pos,50%))}
.ba-range{
  position:absolute;left:0;right:0;bottom:16px;width:calc(100% - 32px);margin-inline:16px;
  appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.45);cursor:ew-resize;z-index:3;
}
.ba-range::-webkit-slider-thumb{
  appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);cursor:grab;box-shadow:var(--sh-2);
}
.ba-range::-moz-range-thumb{
  width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:grab;
}
.ba-tag{
  position:absolute;top:14px;z-index:2;padding:5px 12px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:800;letter-spacing:.1em;background:rgba(10,20,36,.72);color:#fff;
}

/* ── Filtres ──────────────────────────────────────────────── */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{
  padding:9px 16px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:transparent;
  font-size:14px;font-weight:600;color:var(--ink-700);cursor:pointer;transition:all .15s ease;min-height:42px;
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ── Pied de page ─────────────────────────────────────────── */
.site-ft{background:var(--brand-deep);color:var(--on-brand-soft);padding-block:72px 0}
.ft-grid{display:grid;grid-template-columns:1.7fr 1fr 1fr 1.35fr;gap:44px}
.ft-h{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#fff;margin:0 0 18px}
.ft-list{list-style:none;display:flex;flex-direction:column;gap:11px}
.ft-list a{color:var(--on-brand-soft);text-decoration:none;font-size:14.5px;transition:color .15s ease}
.ft-list a:hover{color:#fff;text-decoration:underline}
.ft-bar{
  margin-top:56px;border-top:1px solid var(--on-brand-line);padding-block:24px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13.5px;
}
.ft-bar a{color:var(--on-brand-soft);text-decoration:none}
.ft-bar a:hover{color:#fff;text-decoration:underline}
.soc{display:flex;gap:9px}
.soc a{
  width:38px;height:38px;border-radius:9px;border:1px solid var(--on-brand-line);
  display:grid;place-items:center;color:var(--on-brand-soft);transition:all .16s ease;
}
.soc a:hover{background:#fff;color:var(--brand);border-color:#fff}

/* ── Flottants ────────────────────────────────────────────── */
.wa{
  position:fixed;right:20px;bottom:20px;z-index:90;display:flex;align-items:center;gap:10px;
  background:#25D366;color:#062d14;border:0;border-radius:var(--r-pill);padding:13px 19px;
  font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,.24);
  text-decoration:none;transition:transform .16s ease;
}
.wa:hover{transform:translateY(-2px)}
.wa-close{
  position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;
  background:var(--ink);color:#fff;border:2px solid var(--ground);display:grid;place-items:center;
  cursor:pointer;font-size:13px;line-height:1;padding:0;
}
.cookiebar{
  position:fixed;left:16px;right:16px;bottom:16px;z-index:95;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-3);
  padding:22px;max-width:660px;margin-inline:auto;
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:200;
  background:var(--ink);color:#fff;padding:14px 22px;border-radius:var(--r-pill);
  font-weight:600;font-size:14.5px;box-shadow:var(--sh-3);display:flex;align-items:center;gap:10px;
}

/* ── Animation d'apparition ───────────────────────────────── */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  *{scroll-behavior:auto!important}
}

.adm-side{background:var(--brand-deep);color:var(--on-brand-soft);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.adm-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;text-decoration:none}
.adm-brand .mk{width:34px;height:34px;border-radius:8px;background:linear-gradient(140deg,var(--brand-600),var(--brand));display:grid;place-items:center;color:#fff;flex:none}
.adm-brand .nm{font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;line-height:1.15}
.adm-brand .tg{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--on-brand-soft)}
.adm-grp{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.38);padding:16px 10px 7px}
.adm-nav{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;color:var(--on-brand-soft);text-decoration:none;font-size:14px;font-weight:600;transition:all .14s ease;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}

.adm-nav svg{flex:none;opacity:.9}
.adm-main{display:flex;flex-direction:column;min-width:0}
.adm-top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.adm-body{padding:28px;display:flex;flex-direction:column;gap:24px;flex:1}
.adm-h{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.01em;margin:0}
.adm-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.adm-card-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:7px}
.kpi .lb{font-size:12.5px;font-weight:700;color:var(--ink-500);letter-spacing:.02em}
.kpi .vl{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .ft{font-size:12.5px;color:var(--ink-500)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-100);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.langtab{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.langtab button{padding:7px 14px;border:0;background:transparent;font-size:13px;font-weight:700;color:var(--ink-500);cursor:pointer}
.langtab button[aria-pressed="true"]{background:var(--brand);color:#fff}
.chk-row{display:flex;align-items:flex-start;gap:13px;padding:15px 0;border-bottom:1px solid var(--line-soft)}
.chk-row:last-child{border-bottom:0}
.chk-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.chk-ic.pass{background:var(--ok)}.chk-ic.fail{background:var(--err)}.chk-ic.warn{background:var(--warn)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--card)}

function statsBlock(dark=false){
  // P1 : une valeur nulle, vide ou égale à 0 n'est jamais rendue.
  const list=(S.empty?[]:DB.stats).filter(s=>s.v!==null&&s.v!==undefined&&s.v!==0&&s.v!=='');
  if(!list.length) return '';            // aucune valeur réelle → section absente
  return `<div class="grid c4">${list.map(s=>`<div class="stat${dark?'':''}">
    <span class="v"><span data-count="${s.v}">${s.v}</span>${s.suf?`<sup>${esc(s.suf)}</sup>`:''}</span>
    <span class="k">${esc(s.k)}</span></div>`).join('')}</div>`;
}
function domainCard(d){
  return `<a class="card ruled card-pad stack g16" href="#/expertises/${d.slug}">
    <span style="width:52px;height:52px;border-radius:13px;background:var(--brand-100);color:var(--brand);display:grid;place-items:center">${IC[d.icon](25)}</span>

function beforeAfter(ba,label){
  if(!ba) return '';
  return `<figure class="ba" style="margin:0">
    <div class="ba-imgs">

    <figcaption class="small" style="padding:14px 16px;border-top:1px solid var(--line)">${esc(label)}</figcaption>

function adminFieldSpec(kind){
  const fields=ADMIN_FIELD_MAP[kind]||ADMIN_FIELD_MAP.sections;
  const link=kind==='produits'?`<p class="tiny" style="color:var(--brand-700)"><strong>Chaînage public :</strong> ces champs alimentent le filtre de catégorie, les cartes du catalogue, la fiche détaillée <code>/produits/:slug</code>, la disponibilité, les caractéristiques, le CTA et les métadonnées SEO.</p>`:'';
  return `<div class="notice info" style="margin-bottom:18px">${IC.shield(19)}<div class="stack g6"><strong>Ce module contrôle les éléments visibles suivants</strong><div class="row" style="gap:7px">${fields.map(f=>`<span class="pill neutral">${esc(f)}</span>`).join('')}</div><p class="tiny">La publication est bloquée si les champs obligatoires, le texte alternatif ou la traduction active sont incomplets.</p>${link}</div></div>`;
}

function adminModulePage(section){
  const cfg=ADMIN_MODULES[section]||ADMIN_MODULES.accueil;
  const rows=adminModuleRows(cfg.kind);
  const stateMap={Publié:["ok","Publié"],Brouillon:["neutral","Brouillon"],"À valider":["warn","À valider"],Planifié:["info","Planifié"],"En cours":["info","En cours"],Archivé:["neutral","Archivé"]};
  const body=adminFieldSpec(section==='apropos'?'sectionsApropos':cfg.kind)+(rows.length?`<div class="adm-card">
    <div class="adm-card-h"><div class="row" style="gap:10px;flex:1"><div style="position:relative;flex:1;max-width:360px"><span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-400)">${IC.search(17)}</span><input class="input" style="padding-left:40px" placeholder="Rechercher…" aria-label="Rechercher dans ${esc(cfg.title)}"></div><select class="select" style="width:auto;min-width:150px" aria-label="Filtrer par état"><option>Tous les états</option><option>Publié</option><option>Brouillon</option><option>À valider</option></select></div></div>
    <div class="tbl-wrap" style="border:0"><table><thead><tr><th style="width:36px"><input type="checkbox" aria-label="Tout sélectionner"></th><th>Contenu</th><th>Type</th>${cfg.kind==='produits'?'<th>Catégorie / disponibilité</th>':''}<th>FR / EN</th><th>État</th><th>Modifié</th><th></th></tr></thead><tbody>${rows.map(r=>{const [t,type,en,st,date,extra,slug]=r;const tone=stateMap[st]||["neutral",st];const editHref=cfg.kind==='produits'?`#/admin/edition?kind=produits&slug=${encodeURIComponent(slug||'')}`:'#/admin/edition';const previewHref=cfg.kind==='produits'?`#/produits/${encodeURIComponent(slug||'')}`:'#/';return `<tr><td><input type="checkbox" aria-label="Sélectionner ${esc(t)}"></td><td style="font-weight:600">${esc(t)}</td><td class="small">${esc(type)}</td>${cfg.kind==='produits'?`<td class="small">${esc(extra||' - ')}</td>`:''}<td><span class="row" style="gap:5px"><span class="pill ok" style="padding:2px 7px;font-size:10.5px">FR</span>${en?'<span class="pill ok" style="padding:2px 7px;font-size:10.5px">EN</span>':'<span class="pill warn" style="padding:2px 7px;font-size:10.5px">EN !</span>'}</span></td><td><span class="pill ${tone[0]}">${esc(tone[1])}</span></td><td class="small num">${esc(date)}</td><td><span class="row" style="gap:6px;justify-content:flex-end"><a class="icon-btn" style="width:34px;height:34px" href="${editHref}" aria-label="Modifier ${esc(t)}">${IC.edit(15)}</a><a class="icon-btn" style="width:34px;height:34px" href="${previewHref}" aria-label="Prévisualiser ${esc(t)}">${IC.eye(15)}</a><button class="icon-btn" style="width:34px;height:34px" type="button" aria-label="Supprimer ${esc(t)}" onclick="toast('Confirmation requise avant suppression')">${IC.trash(15)}</button></span></td></tr>`}).join('')}</tbody></table></div></div>`:`<div class="adm-card"><div class="empty-adm"><span class="empty-ic">${IC.layers(24)}</span><h2 class="h3">Aucun contenu publié</h2><p class="small">Créez la première fiche depuis le bouton ci-dessous. Tant qu'elle n'est pas complète, aucune section vide ne sera affichée au public.</p></div></div>`);
  return admShell(section,cfg.title,cfg.sub,body,`<a class="btn btn-primary btn-sm" href="#/admin/editor">${IC.edit(15)} Nouveau contenu</a>`);
}

/* ═══════════════════════════════════════════════════════════
   8. ROUTEUR  -  URL réelle par vue, retour arrière fonctionnel
   ═══════════════════════════════════════════════════════════ */
function resolve(path){
  const p=path.replace(/^#/,'')||'/';
  const seg=p.split('/').filter(Boolean);
  if(seg[0]==='admin'){
    const [section='dashboard',query='']=String(seg[1]||'dashboard').split('?');
    const params=new URLSearchParams(query);
    return {admin:true,section,kind:params.get('kind')||'',slug:params.get('slug')||''};
  }
  const map={'':'home','a-propos':'about','expertises':'expertises','realisations':'realisations',
    'projets':'projets','formations':'formations','produits':'produits','evenements':'evenements',
    'contact':'contact'};
  if(!seg.length) return {view:'home'};
  const root=seg[0];
  if(root==='mentions-legales'||root==='confidentialite') return {view:'legal',kind:root};
  if(!(root in map)) return {view:'e404'};
  if(seg[1]){
    const det={expertises:'expertiseDetail',realisations:'realisationDetail',projets:'projetDetail',
      formations:'formationDetail',produits:'produitDetail',evenements:'evenementDetail'}[root];
    return det?{view:det,slug:seg[1]}:{view:'e404'};
  }
  return {view:map[root]};
}

function render(){
  const path=location.hash.replace(/^#/,'')||'/';
  const r=resolve(path);
  const hd=document.getElementById('chrome'), ft=document.getElementById('chrome-ft'),
        main=document.getElementById('main'), fl=document.getElementById('floats');
  const seo=DB.site.seo||{};
  const meta=document.querySelector('meta[name="description"]');
  if(meta&&seo.description) meta.setAttribute('content',seo.description);

  if(r.admin){
    hd.innerHTML=''; ft.innerHTML=''; fl.innerHTML='';
    main.innerHTML=(ADM[r.section]||ADM.dashboard)(r);
    document.title="Administration  -  Africa Ingénierie";
  }else{
    hd.innerHTML=header(path);
    main.innerHTML=(V[r.view]||V.e404)(r.slug||r.kind);
    ft.innerHTML=footer();
    fl.innerHTML=floats();
    const titles={home:seo.title||"Africa Ingénierie  -  Ingénierie industrielle au Bénin",about:"À propos",
      expertises:"Nos expertises",realisations:"Nos réalisations",projets:"Nos projets",
      formations:"Catalogue des formations",produits:"Nos produits",evenements:"Événements",
      contact:"Contact",e404:"Page introuvable"};
    document.title=(titles[r.view]||"Africa Ingénierie")+(r.view==='home'?'':"  -  Africa Ingénierie");
    bindPublic();
  }
  window.scrollTo({top:0,behavior:'instant'});
  observeReveal(); countUp(); bindDemo();
}

function saveContentDraft(event){
  event.preventDefault();
  const draft={module:settingValue('ed-module'),slug:settingValue('ed-slug'),titleFr:settingValue('ed-title-fr'),titleEn:settingValue('ed-title-en'),status:settingValue('ed-status'),category:settingValue('ed-category'),date:settingValue('ed-date'),short:settingValue('ed-short'),body:settingValue('ed-body'),specs:settingValue('ed-specs'),media:settingValue('ed-media'),alt:settingValue('ed-alt'),cta:settingValue('ed-cta'),ctaUrl:settingValue('ed-cta-url'),seoTitle:settingValue('ed-seo-title'),og:settingValue('ed-og'),seoDescription:settingValue('ed-seo-desc'),visible:!!document.querySelector('#ed-visible:checked'),updatedAt:new Date().toISOString()};
  try{localStorage.setItem('ai-content-draft',JSON.stringify(draft));}catch(e){}
  if(draft.module==='Produits'&&draft.status==='Publié'&&draft.visible&&draft.slug){
    const specs=draft.specs.split(/\n+/).map(x=>x.split(/\s*:\s*/)).filter(x=>x[0]&&x[1]).map(x=>[x[0],x.slice(1).join(':')]);
    const product={slug:draft.slug,cat:draft.category,title:draft.titleFr,short:draft.short,avail:draft.date,desc:draft.body,specs,media:draft.media,alt:draft.alt,seoTitle:draft.seoTitle,og:draft.og,seoDescription:draft.seoDescription};
    const existing=DB.produits.find(p=>p.slug===draft.slug);
    if(existing) Object.assign(existing,product); else DB.produits.push(product);
    try{localStorage.setItem('ai-published-content',JSON.stringify({products:DB.produits}));}catch(e){}
    toast('Produit publié et visible dans le catalogue public');
    return;
  }
  toast(`${draft.module||'Contenu'} enregistré en brouillon  -  validation requise avant publication`);
}

function bindPublic(){
  const b=document.getElementById('burger'), mn=document.getElementById('mobnav');
  if(b&&mn){ b.onclick=()=>{ const o=b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded',String(!o)); mn.style.display=o?'none':'block'; }; }

    mn.style.display='none'; b?.setAttribute('aria-expanded','false'); }));

  const f=document.getElementById('cform');
  if(f){
    const msg=document.getElementById('f-msg'), cnt=document.getElementById('f-msg-c');
    msg?.addEventListener('input',()=>{ cnt.textContent=`${msg.value.length} / 3000`;
      cnt.classList.toggle('over',msg.value.length>3000); });
    f.addEventListener('submit',(e)=>{
      e.preventDefault();
      let ok=true;
      const checks=[['f-nom',v=>v.trim().length>=2,"Indiquez votre nom (2 caractères minimum)."],
        ['f-mail',v=>/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v),"Cette adresse email n'est pas valide. Exemple : nom@entreprise.com"],
        ['f-besoin',v=>!!v,"Sélectionnez le besoin qui correspond à votre demande."],
        ['f-msg',v=>v.trim().length>=20,"Décrivez votre besoin en 20 caractères minimum."]];
      checks.forEach(([id,test,err])=>{
        const el=document.getElementById(id), fld=el.closest('.field');
        fld.querySelector('.err-msg')?.remove(); fld.classList.remove('invalid');
        if(!test(el.value)){ ok=false; fld.classList.add('invalid');
          const p=document.createElement('p'); p.className='err-msg';
          p.innerHTML=IC.alert(14)+'<span>'+esc(err)+'</span>'; fld.appendChild(p); }
      });
      const rg=document.getElementById('f-rgpd');
      const alert=document.getElementById('form-alert');
      if(!rg.checked){ ok=false; }
      if(!ok){
        alert.innerHTML=`<div class="notice err">${IC.alert(19)}<div class="stack g4">
          <strong>Votre demande n'a pas pu être envoyée</strong>
          <p class="small">${rg.checked?'Vérifiez les champs signalés ci-dessous.':'Vous devez accepter la politique de confidentialité pour envoyer votre demande.'}</p></div></div>`;
        alert.scrollIntoView({behavior:'smooth',block:'center'});
      }else{
        alert.innerHTML=`<div class="notice ok">${IC.check(19)}<div class="stack g4">
          <strong>Votre demande a bien été envoyée</strong>
          <p class="small">Un accusé de réception vient de vous être adressé par email. Un ingénieur vous répond sous 24 h ouvrées.</p></div></div>`;
        f.querySelectorAll('.input,.textarea,.select').forEach(i=>i.value=''); rg.checked=false;
        document.getElementById('f-msg-c').textContent='0 / 3000';
        alert.scrollIntoView({behavior:'smooth',block:'center'});
      }
    });
  }
}
function bindTheme(){
  const btn=document.getElementById('theme-btn'); if(!btn) return;
  const cur=document.documentElement.getAttribute('data-theme');
  const dark = cur==='dark' || (!cur && matchMedia('(prefers-color-scheme:dark)').matches);
  btn.innerHTML = dark?IC.sun(19):IC.moon(19);
  btn.setAttribute('aria-label', dark?'Activer le thème clair':'Activer le thème sombre');
  btn.onclick=()=>{ const d=document.documentElement.getAttribute('data-theme');
    const isDark = d==='dark' || (!d && matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
    try{localStorage.setItem('ai-theme',isDark?'light':'dark')}catch(e){}
    bindTheme(); };
}
function observeReveal(){
  const els=document.querySelectorAll('.reveal:not(.in)');
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches){
    els.forEach(e=>e.classList.add('in')); return; }
  const io=new IntersectionObserver((en)=>en.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);} }),{threshold:.12});
  els.forEach(e=>io.observe(e));
}
function countUp(){
  const els=document.querySelectorAll('[data-count]');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){
    els.forEach(e=>e.textContent=e.dataset.count); return; }
  els.forEach(e=>{
    const target=+e.dataset.count;
    if(!target){e.textContent=e.dataset.count;return;}   // jamais un 0 persistant
    const io=new IntersectionObserver((en)=>{ en.forEach(x=>{ if(!x.isIntersecting) return; io.unobserve(e);
      let s=null; const dur=1100;
      const step=(t)=>{ if(!s)s=t; const p=Math.min((t-s)/dur,1);
        e.textContent=Math.round(target*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(step); };
      requestAnimationFrame(step); }); },{threshold:.4});
    io.observe(e);
  });
}
